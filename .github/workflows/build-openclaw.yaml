name: Build & Push OpenClaw Image

on:
  push:
    branches: ["main"]
    paths:
      - "Dockerfile.openclaw"
      - ".github/workflows/build-openclaw.yaml"
  workflow_dispatch:

env:
  REGISTRY: oci.killinit.cc
  IMAGE: openclaw/openclaw

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Create buildx builder
        run: docker buildx create --use --name multiarch --driver docker-container

      - name: Install crane
        run: |
          set -e
          V=$(curl -fsSL https://api.github.com/repos/google/go-containerregistry/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${V}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin crane

      - name: Compute tags
        id: tags
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAGS="${REGISTRY}/${IMAGE}:${SHA},${REGISTRY}/${IMAGE}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: |
          echo "${{ secrets.ZOT_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" --password-stdin
          crane auth login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" -p "${{ secrets.ZOT_PASSWORD }}"

      - name: Build amd64 (native)
        run: |
          set -e
          docker build -t local-openclaw:amd64 -f Dockerfile.openclaw .
          docker save local-openclaw:amd64 -o amd64.tar

      - name: Build arm64 (QEMU)
        run: |
          set -e
          docker buildx build \
            --builder multiarch \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --output "type=docker,dest=arm64.tar" \
            -f Dockerfile.openclaw .

      - name: Push per-arch images with skopeo
        run: |
          set -e
          CREDS="${{ secrets.ZOT_USERNAME }}:${{ secrets.ZOT_PASSWORD }}"
          for ARCH in amd64 arm64; do
            skopeo copy \
              "docker-archive:${ARCH}.tar" \
              "docker://${REGISTRY}/${IMAGE}:build-${ARCH}" \
              --dest-creds "$CREDS"
          done

      - name: Create and push multi-arch manifest
        run: |
          set -e
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for TAG in "${TAG_LIST[@]}"; do
            crane index append \
              --manifest "${REGISTRY}/${IMAGE}:build-amd64" \
              --manifest "${REGISTRY}/${IMAGE}:build-arm64" \
              --tag "$TAG"
          done
