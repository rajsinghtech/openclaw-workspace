name: Validate Config

on:
  pull_request:
    paths:
      - "kustomization/**.json"
      - "kustomization/**.yaml"
      - "kustomization/**.yml"
      - ".github/workflows/**.yaml"
      - "workspaces/**"
  push:
    branches: ["main"]
    paths:
      - "kustomization/**.json"
      - "kustomization/**.yaml"
      - "kustomization/**.yml"
      - "workspaces/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JSON/YAML tools
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          wget -qO /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform

      - name: Validate JSON files
        run: |
          echo "=== Validating JSON files ==="
          for file in kustomization/*.json; do
            echo "Checking $file..."
            jq empty "$file" || exit 1
          done
          echo "✓ All JSON files valid"

      - name: Validate YAML files
        run: |
          echo "=== Validating YAML files ==="
          for file in kustomization/*.yaml kustomization/*.yml; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              yq . "$file" > /dev/null || exit 1
            fi
          done
          echo "✓ All YAML files valid"

      - name: Kustomize build check
        run: |
          echo "=== Checking Kustomize build ==="
          if command -v kustomize >/dev/null 2>&1; then
            kustomize build kustomization/ > /dev/null && echo "✓ Kustomize build successful"
          else
            echo "⚠ kustomize not installed, skipping build check"
          fi

      - name: Check for Flux escaping issues
        run: |
          echo "=== Checking Flux escaping ==="
          # Check that env vars use $$ escaping
          if grep -E '\$\{[A-Z_]+\}' kustomization/openclaw.json | grep -v '\$\$\{' | grep -v '"_comment"'; then
            echo "❌ Error: Found unescaped \${VAR} patterns. Use \$\${VAR} for Flux compatibility."
            echo "   See kustomization/CONFIG.md for details."
            exit 1
          fi
          echo "✓ No unescaped variable references found"

      - name: Check workspace references
        run: |
          echo "=== Checking workspace references ==="
          # Extract agent IDs from config
          agents=$(jq -r '.agents.list[].id' kustomization/openclaw.json | sort -u)
          # Check each agent has a workspace directory
          missing=0
          for agent in $agents; do
            if [ ! -d "workspaces/$agent" ]; then
              echo "❌ Missing workspace directory for agent: $agent"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -eq 0 ]; then
            echo "✓ All agents have workspace directories"
          else
            exit 1
          fi

      - name: Check required workspace files
        run: |
          echo "=== Checking required workspace files ==="
          agents=$(jq -r '.agents.list[].id' kustomization/openclaw.json | sort -u)
          missing=0
          for agent in $agents; do
            if [ -d "workspaces/$agent" ]; then
              for file in AGENTS.md TOOLS.md; do
                if [ ! -f "workspaces/$agent/$file" ]; then
                  echo "❌ workspaces/$agent/$file missing"
                  missing=$((missing + 1))
                fi
              done
            fi
          done
          if [ $missing -gt 0 ]; then
            exit 1
          fi
          echo "✓ All required workspace files present"
