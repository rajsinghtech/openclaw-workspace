name: Validate Config

on:
  pull_request:
    paths:
      - 'kustomization/**/*.json'
      - '**.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run config validation
        run: |
          chmod +x scripts/validate-config.sh
          for f in kustomization/*.json; do
            ./scripts/validate-config.sh "$f" || exit 1
          done
