name: Build & Push Workspace Image

on:
  push:
    branches: ["main", "**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: oci.killinit.cc
  IMAGE: openclaw/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Create buildx builder
        run: docker buildx create --use --name multiarch --driver docker-container

      - name: Install crane
        run: |
          set -e
          V=$(curl -fsSL https://api.github.com/repos/google/go-containerregistry/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${V}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin crane

      - name: Compute tags
        id: tags
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAGS="${REGISTRY}/${IMAGE}:${SHA}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${VERSION}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:latest,${REGISTRY}/${IMAGE}:main"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH="${BRANCH//\//-}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${BRANCH}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: |
          echo "${{ secrets.ZOT_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" --password-stdin
          crane auth login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" -p "${{ secrets.ZOT_PASSWORD }}"

      - name: Debug - compare working vs built manifests
        run: |
          set -e
          echo "=== Working manifest (busybox via crane copy) ==="
          crane copy busybox:latest "${REGISTRY}/${IMAGE}:test-canary"
          crane manifest "${REGISTRY}/${IMAGE}:test-canary" | jq .

          echo "=== Building our image ==="
          docker build -t local-workspace:amd64 -f Dockerfile.workspace .
          docker save local-workspace:amd64 -o amd64.tar

          echo "=== Our image manifest (from docker save) ==="
          mkdir -p debug && tar xf amd64.tar -C debug
          cat debug/manifest.json | jq .
          CONFIG=$(cat debug/manifest.json | jq -r '.[0].Config')
          echo "=== Our image config ==="
          cat "debug/$CONFIG" | jq .

      - name: Push with skopeo (handles format conversion)
        run: |
          set -e
          skopeo copy \
            docker-archive:amd64.tar \
            docker://${REGISTRY}/${IMAGE}:build-amd64 \
            --dest-creds "${{ secrets.ZOT_USERNAME }}:${{ secrets.ZOT_PASSWORD }}"
