name: Build & Push Workspace Image

on:
  push:
    branches: ["main", "**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: oci.killinit.cc
  IMAGE: openclaw/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Create buildx builder
        run: docker buildx create --use --name multiarch --driver docker-container

      - name: Install crane
        run: |
          set -e
          V=$(curl -fsSL https://api.github.com/repos/google/go-containerregistry/releases/latest | jq -r .tag_name)
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${V}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar xz -C /usr/local/bin crane

      - name: Compute tags
        id: tags
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAGS="${REGISTRY}/${IMAGE}:${SHA}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${VERSION}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:latest,${REGISTRY}/${IMAGE}:main"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH="${BRANCH//\//-}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${BRANCH}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: |
          echo "${{ secrets.ZOT_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" --password-stdin
          crane auth login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" -p "${{ secrets.ZOT_PASSWORD }}"

      - name: Test registry accepts images
        run: crane copy busybox:latest "${REGISTRY}/${IMAGE}:test-canary"

      - name: Build amd64 with docker (native)
        run: docker build -t "${REGISTRY}/${IMAGE}:build-amd64" -f Dockerfile.workspace .

      - name: Inspect built image manifest
        run: |
          docker save "${REGISTRY}/${IMAGE}:build-amd64" -o debug.tar
          mkdir -p debug && tar xf debug.tar -C debug
          echo "=== manifest.json ===" && cat debug/manifest.json | jq .
          CONFIG=$(cat debug/manifest.json | jq -r '.[0].Config')
          echo "=== image config ===" && cat "debug/$CONFIG" | jq .

      - name: Push amd64 with docker
        run: docker push "${REGISTRY}/${IMAGE}:build-amd64"

      - name: Build arm64 with buildx
        run: |
          set -e
          docker buildx build \
            --builder multiarch \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            --output "type=docker,dest=arm64.tar" \
            -f Dockerfile.workspace .

      - name: Push arm64 with crane
        run: crane push arm64.tar "${REGISTRY}/${IMAGE}:build-arm64"

      - name: Create and push multi-arch manifest
        run: |
          set -e
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for TAG in "${TAG_LIST[@]}"; do
            crane index append \
              --manifest "${REGISTRY}/${IMAGE}:build-amd64" \
              --manifest "${REGISTRY}/${IMAGE}:build-arm64" \
              --tag "$TAG"
          done
