name: Build & Push Workspace Image

on:
  push:
    branches: ["main", "**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: oci.killinit.cc
  IMAGE: openclaw/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Create buildx builder
        run: docker buildx create --use --name multiarch --driver docker-container

      - name: Compute tags
        id: tags
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAGS="${REGISTRY}/${IMAGE}:${SHA}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${VERSION}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:latest,${REGISTRY}/${IMAGE}:main"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH="${BRANCH//\//-}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${BRANCH}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" --password-stdin

      - name: Build and push per-arch images
        run: |
          set -e
          for ARCH in amd64 arm64; do
            docker buildx build \
              --builder multiarch \
              --platform "linux/${ARCH}" \
              --provenance=false \
              --sbom=false \
              --output "type=image,push=true,oci-mediatypes=false" \
              -t "${REGISTRY}/${IMAGE}:build-${ARCH}" \
              -f Dockerfile.workspace .
          done

      - name: Create and push multi-arch manifest
        run: |
          set -e
          IFS=',' read -ra TAG_LIST <<< "${{ steps.tags.outputs.tags }}"
          for TAG in "${TAG_LIST[@]}"; do
            docker manifest create "$TAG" \
              "${REGISTRY}/${IMAGE}:build-amd64" \
              "${REGISTRY}/${IMAGE}:build-arm64"
            docker manifest push "$TAG"
          done
