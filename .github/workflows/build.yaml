name: Build & Push Workspace Image

on:
  push:
    branches: ["main", "**"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: oci.killinit.cc
  IMAGE: openclaw/workspace

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Compute tags
        id: tags
        run: |
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAGS="${REGISTRY}/${IMAGE}:${SHA}"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${VERSION}"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:latest,${REGISTRY}/${IMAGE}:main"
          else
            BRANCH="${GITHUB_REF#refs/heads/}"
            BRANCH="${BRANCH//\//-}"
            TAGS="${TAGS},${REGISTRY}/${IMAGE}:${BRANCH}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Login to registry
        run: echo "${{ secrets.ZOT_PASSWORD }}" | docker login "$REGISTRY" -u "${{ secrets.ZOT_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --sbom=false \
            $(echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/-t /') \
            --push \
            -f Dockerfile.workspace .
