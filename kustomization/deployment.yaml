---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openclaw
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openclaw
    spec:
      serviceAccountName: tailscale
      imagePullSecrets:
        - name: zot-pull-secret
      initContainers:
        - name: sysctler
          image: ghcr.io/tailscale/tailscale:v1.94.1
          command: [/bin/sh, -c]
          args:
            - >-
              sysctl -w net.ipv4.ip_forward=1 &&
              if sysctl net.ipv6.conf.all.forwarding;
              then sysctl -w net.ipv6.conf.all.forwarding=1; fi
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            privileged: true
        - name: init-workspace
          image: busybox:1.37.0
          command: [sh, -c]
          args:
            - |
              set -e
              echo "[init-workspace] Updating workspaces from OCI image..."
              rm -rf /home/node/.openclaw/workspaces
              cp -a /opt/workspace/workspaces /home/node/.openclaw/workspaces
              echo "[init-workspace] Updating config..."
              rm -f /home/node/.openclaw/clawdbot.json
              cp /opt/config/openclaw.json /home/node/.openclaw/clawdbot.json
              echo "[init-workspace] Updating cron jobs..."
              mkdir -p /home/node/.openclaw/cron
              cp /opt/config/cron-jobs.json /home/node/.openclaw/cron/jobs.json
              echo "[init-workspace] Setting up git config..."
              cat > /home/node/.openclaw/.gitconfig <<'GITCFG'
              [credential "https://github.com"]
                helper = !gh auth git-credential
              [user]
                name = rajsinghtechbot
                email = king360raj@gmail.com
              GITCFG
              echo "[init-workspace] Fixing ownership..."
              chown -R 1000:1000 /home/node/.openclaw
              echo "[init-workspace] Done"
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: workspace
              mountPath: /opt/workspace
              readOnly: true
            - name: config
              mountPath: /opt/config
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      containers:
        - name: openclaw
          image: oci.killinit.cc/openclaw/openclaw:latest
          imagePullPolicy: Always
          env:
            - name: KUBECONFIG
              value: /home/node/.kube/config
            - name: GIT_CONFIG_GLOBAL
              value: /home/node/.openclaw/.gitconfig
            - name: GIT_AUTHOR_NAME
              value: rajsinghtechbot
            - name: GIT_AUTHOR_EMAIL
              value: king360raj@gmail.com
            - name: GIT_COMMITTER_NAME
              value: rajsinghtechbot
            - name: GIT_COMMITTER_EMAIL
              value: king360raj@gmail.com
          envFrom:
            - secretRef:
                name: openclaw-secrets
          startupProbe:
            tcpSocket:
              port: 18790  # WORKAROUND: probe nginx proxy (gateway is loopback-only), revert to 18789 when #19004 is fixed
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 18790  # WORKAROUND: probe nginx proxy (gateway is loopback-only), revert to 18789 when #19004 is fixed
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /home/node/.openclaw
            - name: kubeconfig
              mountPath: /home/node/.kube
              readOnly: true
        - name: tailscale
          image: ghcr.io/tailscale/tailscale:v1.94.1
          securityContext:
            privileged: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_USERSPACE
              value: "false"
            - name: TS_STATE_DIR
              value: /dev/shm
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ts-oauth
                  key: TS_AUTHKEY
            - name: TS_ACCEPT_DNS
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags=tag:k8s,tag:ottawa --accept-routes"
            - name: TS_HOSTNAME
              value: $(POD_NAME)
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        # WORKAROUND: openclaw/openclaw#19004 — v2026.2.19 blocks ws:// on non-loopback
        # but session tools use LAN IP when bind=lan. Nginx reverse proxy bridges
        # external traffic to the loopback-bound gateway with proper WebSocket
        # upgrade and proxy headers. Remove this sidecar and restore bind=lan +
        # containerPort 18789 on the openclaw container once #19004 is fixed upstream.
        # Also revert service-main.yaml targetPort from 18790 back to 18789,
        # and remove the gateway-proxy-config ConfigMap.
        - name: gateway-proxy
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 18790
              protocol: TCP
          volumeMounts:
            - name: gateway-proxy-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      terminationGracePeriodSeconds: 60
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openclaw-data
        - name: workspace
          image:
            reference: oci.killinit.cc/openclaw/workspace:latest
            pullPolicy: Always
        - name: config
          configMap:
            name: openclaw-config
        - name: kubeconfig
          secret:
            secretName: openclaw-kubeconfig
        - name: gateway-proxy-config
          configMap:
            name: gateway-proxy-config
