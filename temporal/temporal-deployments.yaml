apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-frontend
  namespace: temporal
  labels:
    app: temporal-frontend
    app.kubernetes.io/name: temporal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temporal-frontend
  template:
    metadata:
      labels:
        app: temporal-frontend
    spec:
      containers:
        - name: temporal
          image: temporalio/server:1.29.2
          ports:
            - containerPort: 7233
              name: grpc
            - containerPort: 7933
              name: membership
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal:7233"
            - name: TEMPORAL SERVICES
              value: frontend
            - name: DB_TYPE
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: postgres
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
