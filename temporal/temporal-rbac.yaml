apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal
  namespace: temporal
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal
  namespace: temporal
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal
  namespace: temporal
subjects:
  - kind: ServiceAccount
    name: temporal
    namespace: temporal
roleRef:
  kind: Role
  name: temporal
  apiGroup: rbac.authorization.k8s.io
